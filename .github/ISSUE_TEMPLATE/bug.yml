name: Bug report
description: Report something that's broken
labels: ["bug"]
body:
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I've checked this hasn't already been reported
          required: true
        - label: I'm reporting a bug, not requesting a feature
          required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, version, relevant tooling"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Please don't include a root-cause guess, a proposed fix, or a patch in this report. Open a separate pull request for that.
