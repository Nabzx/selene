[project]
name = "selene-sim"
version = "0.0.1"
description = "Simulator, verifier and Argon loop for Selene"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.1",
    "google-genai>=2.30.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selene_sim"]
