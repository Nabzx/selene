[project]
name = "selene-agent"
version = "0.0.1"
description = "Gemini 4 Argon orchestrator for Selene"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.30.1",
    "numpy>=2.5.4",
    "selene-sim",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selene_agent"]

[tool.uv.sources]
selene-sim = { path = "../sim", editable = true }
